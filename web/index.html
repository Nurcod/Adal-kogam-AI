<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адал Кеңесші — AI-навигатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#00a3c4; --sky-d:#007f99; --gold:#e3a91c; --ink:#14232b; --muted:#5d6f78;
  --bg:#f3f7f8; --card:#ffffff; --line:#dde7ea; --bot:#ffffff; --me:#0b6f85;
  --ok:#1f8a4c; --warn:#b5651d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
a{color:var(--sky-d)}
header{background:linear-gradient(120deg,#007f99 0%,#00a3c4 70%);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(227,169,28,.55) 0 30%,transparent 31%),repeating-conic-gradient(rgba(227,169,28,.35) 0 4deg,transparent 4deg 12deg);opacity:.7}
.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-weight:700;color:#07323d;font-size:20px;flex:none;z-index:1}
.brand{z-index:1}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;opacity:.9}
.spacer{flex:1}
.toggle{z-index:1;display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px}
.toggle button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer}
.toggle button.on{background:#fff;color:var(--sky-d);font-weight:600}
main{flex:1;display:flex;min-height:0;max-width:1100px;width:100%;margin:0 auto}
aside{width:280px;padding:18px 14px;border-right:1px solid var(--line);overflow:auto;flex:none}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 6px 10px}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--sky);transform:translateX(2px)}
.quizbtn{background:#fff8e6;border-color:#f1d68e}
.note{font-size:12px;color:var(--muted);margin:16px 6px;line-height:1.45}
section.chat{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow:auto;padding:22px 20px 10px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(720px,92%);padding:12px 15px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--bot);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.me{background:var(--me);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.bot.no_answer,.bot.off_topic{border-left:4px solid var(--warn)}
.bot.ok{border-left:4px solid var(--sky)}
.meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);white-space:normal}
.meta button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;padding:2px 8px;font-size:14px}
.typing{color:var(--muted);font-style:italic}
form{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;height:50px;max-height:140px;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid var(--sky);border-color:transparent}
.btn{border:0;border-radius:14px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer;min-width:50px}
.send{background:var(--sky-d);color:#fff}
.mic{background:#fff;border:1px solid var(--line);font-size:18px}
.mic.rec{background:#ffe5e5;border-color:#e06666;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.quiz-opt{display:block;width:100%;text-align:left;margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;white-space:normal}
.quiz-opt.right{background:#e6f6ec;border-color:var(--ok)}
.quiz-opt.wrong{background:#fdeaea;border-color:#d9534f}
@media (max-width:760px){aside{display:none}.brand p{display:none}header{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <div class="logo">А</div>
  <div class="brand">
    <h1>Адал Кеңесші</h1>
    <p data-i18n="tagline">AI-навигатор по Конституции и внутренней политике РК</p>
  </div>
  <div class="spacer"></div>
  <div class="toggle">
    <button data-lang="kk">ҚАЗ</button><button data-lang="ru" class="on">РУС</button>
  </div>
</header>
<main>
  <aside>
    <h3 data-i18n="topics">Темы</h3>
    <div id="topics"></div>
    <button class="chip quizbtn" id="quiz" data-i18n="quiz">🧠 Викторина</button>
    <p class="note" data-i18n="note">Ответы формируются только по официальным источникам: Конституция РК 2026, законы (adilet.zan.kz), Послания Главы государства (akorda.kz). Если подтверждённой информации нет — бот честно об этом скажет.</p>
  </aside>
  <section class="chat">
    <div id="log"></div>
    <form id="f">
      <textarea id="q" placeholder="Задайте вопрос..." maxlength="1500"></textarea>
      <button class="btn send" data-i18n="send">➤</button>
    </form>
  </section>
</main>
<script>
const I18N={
 ru:{tagline:"AI-навигатор по Конституции и внутренней политике РК",topics:"Темы",quiz:"🧠 Викторина",send:"➤",
     note:"Ответы формируются только по официальным источникам: Конституция РК 2026, законы (adilet.zan.kz), Послания Главы государства (akorda.kz). Если подтверждённой информации нет — бот честно об этом скажет.",
     ph:"Задайте вопрос на русском или казахском...",hello:"Сәлеметсіз бе! Я — <b>Адал Кеңесші</b>. Помогу найти и понятно объяснить положения новой Конституции РК 2026, законов, Посланий Главы государства и ключевых принципов внутренней политики. Каждый ответ — со ссылкой на официальный источник.",
     typing:"Ищу в официальных документах…",err:"Не удалось связаться с сервером. Повторите попытку.",thanks:"Спасибо!",rec:"Говорите… нажмите ещё раз, чтобы отправить",right:"✅ Верно!",wrong:"❌ Неверно."},
 kk:{tagline:"ҚР Конституциясы мен ішкі саясаты бойынша AI-навигатор",topics:"Тақырыптар",quiz:"🧠 Викторина",send:"➤",
     note:"Жауаптар тек ресми дереккөздер негізінде қалыптасады: 2026 жылғы ҚР Конституциясы, заңдар (adilet.zan.kz), Мемлекет басшысының Жолдаулары (akorda.kz). Расталған ақпарат болмаса — бот бұл туралы ашық айтады.",
     ph:"Сұрағыңызды қазақ немесе орыс тілінде жазыңыз...",hello:"Сәлеметсіз бе! Мен — <b>Адал Кеңесші</b>. 2026 жылғы жаңа ҚР Конституциясының, заңдардың, Мемлекет басшысы Жолдауларының және ішкі саясаттың негізгі қағидаттарының мазмұнын табуға және түсіндіруге көмектесемін. Әр жауап — ресми дереккөзге сілтемемен.",
     typing:"Ресми құжаттардан іздеп жатырмын…",err:"Сервермен байланыс болмады. Қайталап көріңіз.",thanks:"Рахмет!",rec:"Сөйлеңіз… жіберу үшін тағы басыңыз",right:"✅ Дұрыс!",wrong:"❌ Қате."}
};
let lang=localStorage.getItem("lang")||"ru";
const sid=(()=>{try{let s=localStorage.getItem("sid");if(!s){s=Math.random().toString(36).slice(2);localStorage.setItem("sid",s)}return s}catch(e){return "web"}})();
const $=s=>document.querySelector(s), log=$("#log");
let topics=[];

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=I18N[lang][el.dataset.i18n]);
  document.querySelectorAll(".toggle button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  $("#q").placeholder=I18N[lang].ph;
  renderTopics();
}
function add(html,cls){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function ask(text){
  text=text.trim(); if(!text) return;
  add(esc(text),"me");
  const wait=add(I18N[lang].typing,"bot typing");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text,session_id:sid})});
    const j=await r.json(); wait.remove();
    if(!r.ok){add(esc(j.detail||I18N[lang].err),"bot no_answer");return}
    const m=add(j.html,"bot "+j.status);
    if(j.status==="ok"){
      const meta=document.createElement("div");meta.className="meta";
      meta.innerHTML=`<button data-v="1">👍</button><button data-v="-1">👎</button><span>${(j.latency_ms/1000).toFixed(1)} с</span>`;
      meta.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
        await fetch("/api/rate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query_id:j.query_id,value:+b.dataset.v})});
        meta.innerHTML=`<span>${I18N[lang].thanks}</span>`});
      m.appendChild(meta);
    }
  }catch(e){wait.remove();add(I18N[lang].err,"bot no_answer")}
}

function renderTopics(){
  $("#topics").innerHTML="";
  topics.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t.title;b.onclick=()=>ask(t[lang]);$("#topics").appendChild(b)});
}

async function quiz(){
  const q=await (await fetch("/api/quiz")).json();
  const box=add(`🧠 <b>${esc(q.question[lang])}</b>`,"bot ok");
  q.options[lang].forEach((o,i)=>{
    const b=document.createElement("button");b.className="quiz-opt";b.textContent=o;
    b.onclick=async()=>{
      const r=await (await fetch(`/api/quiz/${q.id}/${i}`)).json();
      box.querySelectorAll(".quiz-opt").forEach((x,k)=>{x.disabled=true;if(k===r.correct)x.classList.add("right");else if(k===i)x.classList.add("wrong")});
      const src=r.source_url?`<br>📎 <a href="${r.source_url}" target="_blank">${esc(r.source)}</a>`:"";
      add(`${r.ok?I18N[lang].right:I18N[lang].wrong} ${esc(r.explain[lang])}${src}`,"bot ok");
    };
    box.appendChild(b);
  });
  log.scrollTop=log.scrollHeight;
}

$("#f").onsubmit=e=>{e.preventDefault();const v=$("#q").value;$("#q").value="";$("#q").placeholder=I18N[lang].ph;ask(v)};
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#f").requestSubmit()}});
document.querySelectorAll(".toggle button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(e){};applyLang()});
$("#quiz").onclick=quiz;

(async()=>{
  try{topics=await (await fetch("/api/topics")).json()}catch(e){}
  applyLang(); add(I18N[lang].hello,"bot ok");
})();
</script>
</body>
</html>
